version: 1
groups:
  - annotation: ckanext-s3filestore settings
    options:
      - key: ckanext.s3filestore.aws_bucket_name
        example: s3-filestore-test
        default: 
        description: |
            Defines the name of the S3 bucket that serves as the CKAN storage
            backend, used for persisting and managing all uploaded files
        required: true
      - key: ckanext.s3filestore.aws_access_key_id
        example: Your-Access-Key-ID
        default:
        description: |
            Specifies the AWS Access Key ID used for
            authenticating requests to the S3 bucket. Not required when
            ckanext.s3filestore.aws_use_ami_role is enabled.
      - key: ckanext.s3filestore.aws_secret_access_key
        example: Your-Secret-Access-Key
        default:
        description: |
            Specifies the AWS Secret Access Key associated with the IAM
            credentials used to authenticate access to the S3 bucket. Not
            required when ckanext.s3filestore.aws_use_ami_role is enabled.
      - key: ckanext.s3filestore.region_name
        example: us-east-2
        default: 
        description: |
            Specifies the AWS region in which the target 
            S3 bucket is provisioned
        required: true
      - key: ckanext.s3filestore.signature_version
        example: s3v4
        default: 
        description: |
            Defines the AWS Signature Version to be used for request authentication
            when accessing the S3 bucket
        required: true
      - key: ckanext.s3filestore.aws_use_ami_role
        example: true
        type: bool
        default:
        description: |
            Indicates whether the S3 client should use the IAM role
            attached to the Amazon EC2 instance or authentication
            instead of explicit AWS credentials
      - key: ckanext.s3filestore.odsp_bucket_name
        example: my-odsp-bucket
        default:
        description: |
            S3 bucket name for the AWS Open Data Sponsorship Program (ODSP).
            When set, resources whose dataset license matches one of the IDs
            in ckanext.s3filestore.odsp_open_license_ids will be stored in
            this bucket instead of the default aws_bucket_name bucket.
      - key: ckanext.s3filestore.odsp_open_license_ids
        example: cc-by cc-zero odc-pddl odc-odbl
        default: ""
        description: |
            Space-separated list of CKAN license IDs treated as open licenses
            for the AWS ODSP bucket. Resources belonging to datasets with these
            licenses will be uploaded to ckanext.s3filestore.odsp_bucket_name.
      - key: ckanext.s3filestore.odsp_aws_access_key_id
        example: Your-ODSP-Access-Key-ID
        default:
        description: |
            AWS Access Key ID for the ODSP bucket account. If not set, the
            default aws_access_key_id is used.
      - key: ckanext.s3filestore.odsp_aws_secret_access_key
        example: Your-ODSP-Secret-Access-Key
        default:
        description: |
            AWS Secret Access Key for the ODSP bucket account. If not set,
            the default aws_secret_access_key is used.
      - key: ckanext.s3filestore.odsp_region_name
        example: us-east-1
        default:
        description: |
            AWS region where the ODSP bucket is located. If not set, the
            default region_name is used.
